# Redis Configuration for Lab Environment

# Bind na interface padrão
bind 0.0.0.0

# Porta
port 6379

# Modo protected (desabilitado em ambiente de lab)
protected-mode no

# Timeout
timeout 0

# TCP keepalive
tcp-keepalive 300

# Daemonize (não necessário em Docker)
daemonize no

# Nível de log
loglevel notice

# Banco de dados
databases 16

# Snapshot RDB
save 900 1
save 300 10
save 60 10000

# Compressão RDB
rdbcompression yes

# Nome do arquivo RDB
dbfilename dump.rdb

# Diretório de trabalho
dir ./

# Replicação
replica-serve-stale-data yes
replica-read-only yes

# Sem password no lab (apenas para demonstração)
# requirepass your_password_here

# Lua scripting
lua-time-limit 5000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notification
notify-keyspace-events ""

# Hash table
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List
list-max-ziplist-size -2
list-compress-depth 0

# Set
set-max-intset-entries 512

# Sorted Set
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Stream
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limit
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of active defrag
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-ignore-bytes 104857600
active-defrag-ignore-keys 10000

# Append Only File (AOF)
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Modules
# loadmodule /path/to/module.so
